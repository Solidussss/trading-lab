name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests (including live-trading-impossible proofs)
        env:
          # No real credentials in CI: the suite uses obviously fake paper-format keys.
          PYTHONHASHSEED: "0"
        run: pytest
      - name: Refuse committed secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then echo ".env committed"; exit 1; fi
          if git grep -nE '\b(AK|PK)[A-Z0-9]{16,}\b' -- ':!tests/*'; then
            echo "possible Alpaca key in repo"; exit 1; fi

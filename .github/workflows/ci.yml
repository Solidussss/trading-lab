name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:  # real PostgreSQL for the store tests (trust auth, test-only)
        image: postgres:16
        env:
          POSTGRES_USER: tl
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U tl" --health-interval 5s --health-timeout 5s --health-retries 10
    strategy:
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests (including no-real-trading proofs)
        env:
          # No real credentials in CI: the suite uses obviously fake tokens and no network.
          PYTHONHASHSEED: "0"
          TL_TEST_PG: "127.0.0.1:55432"
        run: pytest
      - name: Refuse committed secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then echo ".env committed"; exit 1; fi
          if git grep -nE 'sk-ant-[A-Za-z0-9_-]{20,}|\b[0-9a-f]{40}\b' -- ':!tests/*'; then
            echo "possible API key in repo"; exit 1; fi

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradinglab"
version = "0.1.0"
description = "Private, simulation-only quantitative trading research lab."
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = { text = "Proprietary - personal use" }
dependencies = [
    # The engine, simulator, safety layer and data client use only the standard library.
    # No brokerage SDK is (or may be) a dependency: see docs/SAFETY.md.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Phases 4-6 (database, API, dashboard backend). Declared now so the lock is stable.
server = [
    "fastapi>=0.115",
    # Plain uvicorn on purpose: uvicorn[standard] installs uvloop, whose C-level DNS and
    # sockets bypass the Python audit hook used by the paper-only network guard.
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
]
research = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # asserts document invariants

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"src/tradinglab/research/cli.py" = ["E501"]  # report templates
"src/tradinglab/web/views.py" = ["E501"]  # HTML/CSS template
"src/tradinglab/research/synthetic.py" = ["S311"]  # seeded test data, not cryptography
